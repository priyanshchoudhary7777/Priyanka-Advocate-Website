<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Enquiry inbox | Advocate Priyanka Choudhary</title>
  <style>
    :root{font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f8f7f3}
    *{box-sizing:border-box}
    body{margin:0}
    main{max-width:900px;margin:0 auto;padding:32px 18px}
    h1{color:#0b2545;font-size:clamp(1.7rem,5vw,2.4rem);margin:0}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}
    .subtle{color:#5b6574}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0}
    .list{display:grid;gap:14px}
    article{background:#fff;border:1px solid #e3e0d6;border-radius:8px;padding:18px}
    article h2{font-size:1.15rem;margin:0}
    .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:#5b6574;font-size:.92rem;margin:8px 0 12px}
    .message{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
    .receipt{display:block;width:min(100%,360px);height:auto;margin-top:12px;border:1px solid #e3e0d6;border-radius:6px}
    .receipt-link{display:inline-block;margin-top:12px;color:#0b2545;font-weight:600}
    button,.button{border:1px solid #0b2545;border-radius:6px;background:#0b2545;color:white;padding:9px 13px;font:inherit;text-decoration:none;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    .delete{background:white;color:#9b1c1c;border-color:#c8a4a4;margin-top:14px}
    #status{min-height:1.5em;color:#9b1c1c}
    @media(max-width:550px){.top,.toolbar{align-items:flex-start;flex-direction:column}.toolbar button{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Enquiry inbox</h1>
      <a class="button" href="/">View website</a>
    </div>
    <p class="subtle">Enquiry details and payment screenshots are private. Screenshots are submitted for manual payment verification. Use a secure device and sign out by closing the browser when finished.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="toolbar">
      <span id="count" class="subtle"></span>
      <div>
        <button id="previous" type="button">Previous</button>
        <button id="next" type="button">Next</button>
      </div>
    </div>
    <div id="list" class="list"></div>
  </main>
  <script src="/admin.js" defer></script>
</body>
</html>
